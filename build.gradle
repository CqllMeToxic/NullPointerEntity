plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	// TerraformersMC Maven for ModMenu
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}

	// JitPack for Discord RPC library
	maven {
		name = "JitPack"
		url = "https://jitpack.io"
	}

	// Modrinth Maven for Shriek + Architectury API
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
    // Not implemented yet, will be in a future update (I couldn't figure it out :( )


	// Maven Central for more dependencies
	mavenCentral()
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but it's probably better to include it.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// ModMenu for proper mod display
	modImplementation "com.terraformersmc:modmenu:13.0.0-beta.1"

	// SQLite JDBC driver for browser history reading
	implementation 'org.xerial:sqlite-jdbc:3.47.1.0'
	include 'org.xerial:sqlite-jdbc:3.47.1.0'

	// Webcam Capture library for camera overlay
	implementation 'com.github.sarxos:webcam-capture:0.3.12'
	include 'com.github.sarxos:webcam-capture:0.3.12'

	// Shriek speech-to-text + Architectury API
	modImplementation "maven.modrinth:shriek:1.1.2+fabric"
	modImplementation "maven.modrinth:architectury-api:13.0.2+fabric"
}

processResources {
	inputs.property "version", project.version
	inputs.property "fabricloader_version", project.loader_version
	inputs.property "minecraft_version", project.minecraft_version

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
			   "fabricloader_version": project.loader_version,
			   "minecraft_version": project.minecraft_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.compilerArgs.add('-Xlint:deprecation')
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName}"}
	}
	archiveClassifier = ""
}

// ensure the main JAR is built correctly
remapJar {
	archiveClassifier = ""
	destinationDirectory = file("$buildDir/libs")
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
